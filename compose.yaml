services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokenex
      POSTGRES_PASSWORD: tokenex_local
      POSTGRES_DB: tokenex
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["tokenex-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenex -d tokenex"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  tokenex-data:
